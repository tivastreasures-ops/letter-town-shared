<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Letter Town</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe6f5; font-family: Georgia, serif; }
  canvas { display: block; touch-action: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 14px; background: rgba(255, 248, 234, 0.92); color: #5a3b22; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  #vr { font: bold 20px Georgia, serif; padding: 10px 22px; border-radius: 12px; border: 3px solid #c99a5b; background: #ffd9e6; color: #5a3b22; }
  #vr:disabled { opacity: 0.6; }
  #note { font-size: 15px; flex: 1; min-width: 220px; }
</style>
</head>
<body>
<div id="bar">
  <button id="vr" disabled>Checking for VR…</button>
  <div id="note">Letter Town, Chapter One. In the headset: poke the board with a fingertip, or point and pinch. In the garden: pinch to pick things up.</div>
</div>
<script type="module" src="app/main.js"></script>
</body>
</html>
